# Install in the central nginx-proxy only AFTER both .it names resolve to the
# proxy and the certificate/key below exist. See docs/runbook/deployment.md.

server {
    listen 80;
    listen [::]:80;
    server_name egadisailing.it www.egadisailing.it;

    return 301 https://egadisailing.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name egadisailing.it www.egadisailing.it;

    ssl_certificate     /etc/nginx/ssl/egadisailing.it.pem;
    ssl_certificate_key /etc/nginx/ssl/egadisailing.it.key;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    return 301 https://egadisailing.com$request_uri;
}
