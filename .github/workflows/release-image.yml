name: Release image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-image-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/akasama26/egadisailing
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      APP_URL: https://egadisailing.com
      NEXTAUTH_URL: https://egadisailing.com
      SERVER_ACTIONS_ALLOWED_ORIGINS: egadisailing.com,www.egadisailing.com
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_ASSET_CDN_URL: ${{ vars.NEXT_PUBLIC_ASSET_CDN_URL }}
      NEXT_PUBLIC_HOME_TOUR_EGADI_VIDEO_URL: ${{ vars.NEXT_PUBLIC_HOME_TOUR_EGADI_VIDEO_URL }}
      NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_ID }}
      NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
      NEXT_PUBLIC_BING_UET_TAG_ID: ${{ vars.NEXT_PUBLIC_BING_UET_TAG_ID }}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
      NEXT_PUBLIC_META_DOMAIN_VERIFICATION: ${{ vars.NEXT_PUBLIC_META_DOMAIN_VERIFICATION }}
      TRIVY_VERSION: 0.69.2
      TRIVY_SHA256: affa59a1e37d86e4b8ab2cd02f0ab2e63d22f1bf9cf6a7aa326c884e25e26ce3
      TRIVY_BUNDLE_SHA256: dab3ba23f41fb2f1035e24920cbde4dfac0595b43d4ce239885cb4c1e947ad1e
      COSIGN_VERSION: 3.0.6
      COSIGN_SHA256: c956e5dfcac53d52bcf058360d579472f0c1d2d9b69f55209e256fe7783f4c74
      EXPECTED_CERTIFICATE_IDENTITY: https://github.com/AkaSama26/egadisailing/.github/workflows/release-image.yml@refs/heads/main
      EXPECTED_OIDC_ISSUER: https://token.actions.githubusercontent.com

    steps:
      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout the CI-proven commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up pinned Docker Buildx and BuildKit
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      - name: Validate production public build configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY" == pk_live_* ]]
          test -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY"
          test "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" != "1x00000000000000000000AA"
          test -n "$NEXT_PUBLIC_GTM_ID"
          test -n "$NEXT_PUBLIC_GA_MEASUREMENT_ID"
          test -n "$NEXT_PUBLIC_GOOGLE_ADS_ID"
          test -n "$NEXT_PUBLIC_META_PIXEL_ID"
          test -n "$NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION"
          test -n "$NEXT_PUBLIC_BING_SITE_VERIFICATION"
          test -n "$NEXT_PUBLIC_META_DOMAIN_VERIFICATION"
          config_sha="$(bash scripts/public-build-config-hash.sh)"
          [[ "$config_sha" =~ ^[0-9a-f]{64}$ ]]

      # GHSA-69fq-xp46-6x23: use a checksum-pinned Trivy release rather than
      # a mutable setup action/tag.
      - name: Install verified Trivy
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/trivy.tar.gz"
          bundle="${RUNNER_TEMP}/trivy.sigstore.json"
          release_url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --output "$archive" \
            "${release_url}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --output "$bundle" \
            "${release_url}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz.sigstore.json"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --strict
          echo "${TRIVY_BUNDLE_SHA256}  ${bundle}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install checksum-pinned Cosign
        shell: bash
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/cosign"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --output "$binary" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  ${binary}" | sha256sum --check --strict
          chmod 0755 "$binary"
          "$binary" version

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the immutable full-SHA tag (fail closed and retry-safe)
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag_state="$(bash scripts/check-ghcr-release-tag.sh "$IMAGE_NAME" "$RELEASE_SHA")"
          if [[ "$tag_state" == "absent" ]]; then
            echo "RELEASE_PREEXISTS=false" >> "$GITHUB_ENV"
          else
            [[ "$tag_state" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "RELEASE_PREEXISTS=true" >> "$GITHUB_ENV"
            echo "SCAN_IMAGE=${IMAGE_NAME}@${tag_state}" >> "$GITHUB_ENV"
            echo "full-SHA tag already exists; validating its exact digest"
          fi

      - name: Build and push one private candidate with SBOM and provenance
        if: env.RELEASE_PREEXISTS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidate="${IMAGE_NAME}:candidate-${RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          metadata="${RUNNER_TEMP}/build-metadata.json"
          GIT_SHA="$RELEASE_SHA" bash scripts/build-production-image.sh \
            "$candidate" \
            --push \
            --metadata-file "$metadata" \
            --provenance=mode=max \
            --sbom=true
          digest="$(jq -er '."containerimage.digest"' "$metadata")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "SCAN_IMAGE=${IMAGE_NAME}@${digest}" >> "$GITHUB_ENV"
          echo "CANDIDATE_TAG=$candidate" >> "$GITHUB_ENV"

      - name: Smoke-test the exact pushed digest
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$SCAN_IMAGE"
          expected_config_sha="$(bash scripts/public-build-config-hash.sh)"
          actual_config_sha="$(docker image inspect --format '{{index .Config.Labels "com.egadisailing.public-config-sha256"}}' "$SCAN_IMAGE")"
          actual_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$SCAN_IMAGE")"
          actual_version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$SCAN_IMAGE")"
          test "$actual_config_sha" = "$expected_config_sha"
          test "$actual_revision" = "$RELEASE_SHA"
          test "$actual_version" = "$RELEASE_SHA"
          docker run --rm \
            --volume "$PWD/scripts/verify-runtime-image.mjs:/tmp/verify-runtime-image.mjs:ro" \
            --entrypoint /nodejs/bin/node \
            "$SCAN_IMAGE" /tmp/verify-runtime-image.mjs

      - name: Verify SBOM and provenance attestations
        shell: bash
        run: |
          set -euo pipefail
          index_json="${RUNNER_TEMP}/candidate-index.json"
          docker buildx imagetools inspect --raw "$SCAN_IMAGE" > "$index_json"
          attestation_digest="$(
            jq -er '.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") | .digest' \
              "$index_json" | head -n 1
          )"
          attestation_json="${RUNNER_TEMP}/candidate-attestation.json"
          docker buildx imagetools inspect --raw "${IMAGE_NAME}@${attestation_digest}" > "$attestation_json"
          jq -e '[.layers[].annotations["in-toto.io/predicate-type"]] | any(. == "https://spdx.dev/Document")' \
            "$attestation_json" >/dev/null
          jq -e '[.layers[].annotations["in-toto.io/predicate-type"]] | any(startswith("https://slsa.dev/provenance/"))' \
            "$attestation_json" >/dev/null

      - name: Scan the exact pushed digest for high and critical vulnerabilities
        run: >-
          trivy image
          --exit-code 1
          --severity HIGH,CRITICAL
          --scanners vuln
          --ignorefile .trivyignore.yaml
          --show-suppressed
          --no-progress
          "$SCAN_IMAGE"

      # Sign the scanned digest before promotion. On a retry where the release
      # tag already exists we never legitimize it retroactively: the next step
      # accepts it only if a prior run already produced a valid workflow-bound
      # signature for that exact digest.
      - name: Sign the scanned digest with GitHub OIDC
        if: env.RELEASE_PREEXISTS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/cosign" sign --yes "$SCAN_IMAGE"

      - name: Verify workflow identity signature on the exact digest
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/cosign" verify \
            --certificate-identity "$EXPECTED_CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_OIDC_ISSUER" \
            "$SCAN_IMAGE" >/dev/null

      - name: Recheck full-SHA tag immediately before promotion
        if: env.RELEASE_PREEXISTS != 'true'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(bash scripts/check-ghcr-release-tag.sh "$IMAGE_NAME" "$RELEASE_SHA")" = "absent"

      - name: Promote the scanned digest to the immutable full-SHA tag
        if: env.RELEASE_PREEXISTS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_ref="${IMAGE_NAME}:${RELEASE_SHA}"
          docker buildx imagetools create --tag "$release_ref" "$SCAN_IMAGE"

      - name: Verify the immutable full-SHA tag
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_digest="${SCAN_IMAGE##*@}"
          release_ref="${IMAGE_NAME}:${RELEASE_SHA}"
          release_digest="$(
            bash scripts/check-ghcr-release-tag.sh "$IMAGE_NAME" "$RELEASE_SHA"
          )"
          test "$release_digest" = "$source_digest"
          docker pull "$release_ref"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$release_ref")" = "$RELEASE_SHA"
          echo "published $release_ref as $release_digest"
