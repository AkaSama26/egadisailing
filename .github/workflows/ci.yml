name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.0
  NPM_VERSION: 11.16.0

jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml

  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: egadisailing
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: egadisailing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://egadisailing:test-password@localhost:5432/egadisailing_test
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_SECRET: ci-test-secret-at-least-32-characters-long-xxxx
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      CRON_SECRET: ci-test-cron-secret-at-least-32-characters-abc
      OPS_HEALTH_SECRET: ci-ops-health-secret-at-least-32-characters # gitleaks:allow test-only placeholder
      BOKUN_PRICING_SYNC_ENABLED: "false"
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Verify SWC peer tree
        run: npm ls @swc/helpers --all

      - name: Prisma generate
        run: npm run db:generate

      - name: Prisma migrate deploy
        run: npm run db:deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          GIT_SHA: ${{ github.sha }}
          NEXT_DEPLOYMENT_ID: ${{ github.sha }}
          DEPLOYMENT_VERSION: ${{ github.sha }}
          SENTRY_RELEASE: ${{ github.sha }}
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
          BREVO_API_KEY: ci-brevo-test
          TURNSTILE_SECRET_KEY: ci-turnstile-test
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ci-turnstile-test
          SEED_ADMIN_PASSWORD: ci-admin-password-test

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify npm version
        run: test "$(npm --version)" = "${NPM_VERSION}"

      - name: Audit complete dependency tree
        run: npm audit --audit-level=high

      - name: Audit runtime dependency tree
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Scan complete Git history
        run: gitleaks git --redact --verbose --gitleaks-ignore-path .gitleaksignore .

  container:
    if: github.event_name == 'pull_request'
    needs: [workflow-lint, ci, audit, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      IMAGE_NAME: ghcr.io/akasama26/egadisailing
      APP_URL: https://egadisailing.com
      SERVER_ACTIONS_ALLOWED_ORIGINS: egadisailing.com,www.egadisailing.com
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_ASSET_CDN_URL: ${{ vars.NEXT_PUBLIC_ASSET_CDN_URL }}
      NEXT_PUBLIC_HOME_TOUR_EGADI_VIDEO_URL: ${{ vars.NEXT_PUBLIC_HOME_TOUR_EGADI_VIDEO_URL }}
      NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_ADS_ID }}
      NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
      NEXT_PUBLIC_BING_UET_TAG_ID: ${{ vars.NEXT_PUBLIC_BING_UET_TAG_ID }}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
      NEXT_PUBLIC_META_DOMAIN_VERIFICATION: ${{ vars.NEXT_PUBLIC_META_DOMAIN_VERIFICATION }}
      TRIVY_VERSION: 0.69.2
      TRIVY_SHA256: affa59a1e37d86e4b8ab2cd02f0ab2e63d22f1bf9cf6a7aa326c884e25e26ce3
      TRIVY_BUNDLE_SHA256: dab3ba23f41fb2f1035e24920cbde4dfac0595b43d4ce239885cb4c1e947ad1e
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.34.1
          driver-opts: image=moby/buildkit:v0.30.0@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      # GHSA-69fq-xp46-6x23: use the last known-good Trivy release and verify
      # both the binary archive and its Sigstore bundle. Do not use trivy-action
      # or setup-trivy tags here.
      - name: Install verified Trivy
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/trivy.tar.gz"
          bundle="${RUNNER_TEMP}/trivy.sigstore.json"
          release_url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --output "${archive}" \
            "${release_url}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location \
            --output "${bundle}" \
            "${release_url}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz.sigstore.json"
          echo "${TRIVY_SHA256}  ${archive}" | sha256sum --check --strict
          echo "${TRIVY_BUNDLE_SHA256}  ${bundle}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" trivy
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Build image for security scan
        shell: bash
        run: |
          set -euo pipefail
          stripe_key="${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_ci}"
          turnstile_key="${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}"
          export NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="$stripe_key"
          export NEXT_PUBLIC_TURNSTILE_SITE_KEY="$turnstile_key"
          image="${IMAGE_NAME}:ci-${GITHUB_SHA}"
          GIT_SHA="$GITHUB_SHA" NEXTAUTH_URL="$APP_URL" \
            bash scripts/build-production-image.sh "$image" --load
          echo "SCAN_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Smoke-test immutable image contents
        shell: bash
        run: |
          set -euo pipefail
          image="${SCAN_IMAGE:?SCAN_IMAGE was not set by the build step}"
          export NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-pk_test_ci}"
          export NEXT_PUBLIC_TURNSTILE_SITE_KEY="${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}"
          expected_config_sha="$(bash scripts/public-build-config-hash.sh)"
          actual_config_sha="$(docker image inspect --format '{{index .Config.Labels "com.egadisailing.public-config-sha256"}}' "$image")"
          actual_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
          actual_version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")"
          test "$actual_config_sha" = "$expected_config_sha"
          test "$actual_revision" = "$GITHUB_SHA"
          test "$actual_version" = "$GITHUB_SHA"
          docker run --rm \
            --volume "$PWD/scripts/verify-runtime-image.mjs:/tmp/verify-runtime-image.mjs:ro" \
            --entrypoint /nodejs/bin/node \
            "$image" /tmp/verify-runtime-image.mjs

      - name: Scan image for high and critical vulnerabilities
        run: >-
          trivy image
          --exit-code 1
          --severity HIGH,CRITICAL
          --scanners vuln
          --no-progress
          "${SCAN_IMAGE}"
